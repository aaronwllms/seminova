<h2 class="sr-only">
  Final approved error panel mockup, option B1, neutral surface with danger
  color reserved for icon and title
</h2>
<div style="max-width: 480px">
  <div
    style="
      border: 0.5px solid var(--border);
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 16px;
    "
  >
    <div
      style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px"
    >
      <i
        class="ti ti-alert-triangle"
        style="font-size: 20px; color: var(--text-danger)"
        aria-hidden="true"
      ></i>
      <p
        style="
          font-size: 15px;
          font-weight: 500;
          color: var(--text-primary);
          margin: 0;
        "
      >
        Something went wrong
      </p>
    </div>
    <p
      style="
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 12px;
        padding-left: 30px;
      "
    >
      This page could not be loaded. Try again or sign in.
    </p>
    <div
      style="
        margin-left: 30px;
        background: var(--surface-0);
        border-radius: var(--radius);
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      "
    >
      <span
        style="
          font-family: var(--font-mono);
          font-size: 13px;
          color: var(--text-secondary);
        "
        >INTERNAL_ERROR · a91c4e</span
      >
      <button
        style="
          display: flex;
          align-items: center;
          gap: 4px;
          background: transparent;
          border: 0.5px solid var(--border-strong);
          border-radius: var(--radius);
          padding: 4px 8px;
          cursor: pointer;
          font-size: 12px;
          color: var(--text-primary);
        "
      >
        <i class="ti ti-copy" style="font-size: 14px" aria-hidden="true"></i
        >Copy
      </button>
    </div>
  </div>
</div>
