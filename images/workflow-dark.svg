<svg width="860" height="320" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Seminova workflow, dark mode</title>
<desc>Project kickoff and initialize project sit centered above a phase loop container. Inside, plan phase leads into a nested epic loop container of plan epic, review plan, build, then out to ship phase. A dashed revise arrow returns from review plan to plan epic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g>
<rect x="260" y="40" width="150" height="68" rx="8" fill="#2a2470" stroke="#8b82e0" stroke-width="1"/>
<text x="335" y="58" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#cbc6f7" font-family="sans-serif">Project kickoff</text>
<text x="335" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#a79fe8" font-family="sans-serif">project-kickoff</text>
<text x="335" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#a79fe8" font-family="sans-serif">Claude</text>
</g>
<line x1="410" y1="74" x2="434" y2="74" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="436" y="40" width="170" height="68" rx="8" fill="#0b3b30" stroke="#4fbfa0" stroke-width="1"/>
<text x="521" y="58" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#bff0de" font-family="sans-serif">Initialize project</text>
<text x="521" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#7fd4b8" font-family="sans-serif">initialize-project</text>
<text x="521" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7fd4b8" font-family="sans-serif">Cursor</text>
</g>

<path d="M521 108 V140 H125 V184" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="150" width="786" height="140" rx="12" fill="none" stroke="#6b6b70" stroke-width="1" stroke-dasharray="6 4"/>
<text x="806" y="166" text-anchor="end" font-size="11" fill="#9b9ba0" font-family="sans-serif">↻ Phase loop</text>

<g>
<rect x="60" y="186" width="130" height="68" rx="8" fill="#2a2470" stroke="#8b82e0" stroke-width="1"/>
<text x="125" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#cbc6f7" font-family="sans-serif">Plan phase</text>
<text x="125" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#a79fe8" font-family="sans-serif">phase-planning</text>
<text x="125" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#a79fe8" font-family="sans-serif">Claude</text>
</g>
<line x1="190" y1="220" x2="214" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="216" y="170" width="434" height="100" rx="12" fill="none" stroke="#6b6b70" stroke-width="1" stroke-dasharray="6 4"/>
<text x="228" y="184" font-size="10" fill="#9b9ba0" font-family="sans-serif">↻ Epic loop</text>

<g>
<rect x="232" y="186" width="130" height="68" rx="8" fill="#0b3b30" stroke="#4fbfa0" stroke-width="1"/>
<text x="297" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#bff0de" font-family="sans-serif">Plan epic</text>
<text x="297" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#7fd4b8" font-family="sans-serif">plan-next-epic</text>
<text x="297" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7fd4b8" font-family="sans-serif">Cursor</text>
</g>
<line x1="362" y1="220" x2="386" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="388" y="186" width="130" height="68" rx="8" fill="#2a2470" stroke="#8b82e0" stroke-width="1"/>
<text x="453" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#cbc6f7" font-family="sans-serif">Review plan</text>
<text x="453" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#a79fe8" font-family="sans-serif">plan-review</text>
<text x="453" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#a79fe8" font-family="sans-serif">Claude</text>
</g>
<line x1="518" y1="220" x2="542" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="544" y="186" width="90" height="68" rx="8" fill="#0b3b30" stroke="#4fbfa0" stroke-width="1"/>
<text x="589" y="210" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#bff0de" font-family="sans-serif">Build</text>
<text x="589" y="230" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7fd4b8" font-family="sans-serif">Cursor</text>
</g>

<path d="M453 254 L453 264 L297 264 L297 256" fill="none" stroke="#6b6b70" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="375" y="263" text-anchor="middle" font-size="9" fill="#9b9ba0" font-family="sans-serif">revise</text>

<line x1="650" y1="220" x2="674" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="676" y="186" width="130" height="68" rx="8" fill="#0b3b30" stroke="#4fbfa0" stroke-width="1"/>
<text x="741" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#bff0de" font-family="sans-serif">Ship phase</text>
<text x="741" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#7fd4b8" font-family="sans-serif">ship-phase</text>
<text x="741" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7fd4b8" font-family="sans-serif">Cursor</text>
</g>
</svg>
