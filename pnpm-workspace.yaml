allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

overrides:
  js-yaml@4: ^4.3.0
  brace-expansion@1: 1.1.16
  brace-expansion@2: 2.1.2
  brace-expansion@5: 5.0.7
  # Temporary: stable Next.js still declares optional sharp@^0.34.5, which carries a libvips advisory.
  # Remove this override once a stable Next.js release depends on sharp >=0.35 — then bump next,
  # re-run `pnpm install` / `pnpm audit`, and smoke-check /icon, OG image routes, and next/image.
  sharp: ^0.35.3
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  vite: '>=6.4.3'
  '@babel/core': '>=7.29.1'
  postcss: '>=8.5.10'
