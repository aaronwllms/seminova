allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

overrides:
  js-yaml@4: '>=4.3.1'
  # Selector-scoped overrides need a CAPPED range (caret), not a bare floor.
  # '>=1.1.18' resolves onto any later major — including 5.x — which defeats the
  # @1 scoping and hands 1.x-API consumers (ESLint's minimatch@3) an incompatible module.
  brace-expansion@1: '^1.1.18'
  brace-expansion@2: '^2.1.4'
  brace-expansion@5: '^5.0.9'
  nanoid: '>=3.3.18'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  vite: '>=6.4.3'
  '@babel/core': '>=7.29.1'
  postcss: '>=8.5.23'
