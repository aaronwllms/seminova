<h2 class="sr-only">Exact recreation of the existing workflow diagram with L-shaped connectors, nested loop containers, and a visible dashed revise arrow, now hoverable for step detail</h2>
<svg width="100%" viewBox="0 0 860 320" role="img">
<title>Seminova workflow</title>
<desc>Project kickoff and initialize project feed into a phase loop containing plan phase and a nested epic loop of plan epic, review plan, build, then out to ship phase, with a dashed revise arrow back from review plan to plan epic.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node" data-detail="One-time setup when a spinoff is cloned from the template. Claude, project-kickoff.">
<rect x="260" y="40" width="150" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="335" y="58" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#26215C" font-family="sans-serif">Project kickoff</text>
<text x="335" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#534AB7" font-family="sans-serif">project-kickoff</text>
<text x="335" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7" font-family="sans-serif">Claude</text>
</g>
<line x1="410" y1="74" x2="434" y2="74" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="node" data-detail="Cursor scaffolds the spinoff repo from the template. Cursor, initialize-project.">
<rect x="436" y="40" width="170" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="521" y="58" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#04342C" font-family="sans-serif">Initialize project</text>
<text x="521" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#0F6E56" font-family="sans-serif">initialize-project</text>
<text x="521" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="sans-serif">Cursor</text>
</g>

<path d="M521 108 V140 H125 V184" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="150" width="786" height="140" rx="12" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
<text x="806" y="166" text-anchor="end" font-size="11" fill="#57606a" font-family="sans-serif">↻ Phase loop</text>

<g class="node" data-detail="Requirements and success criteria lock in before any epic starts. Claude, phase-planning.">
<rect x="60" y="186" width="130" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="125" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#26215C" font-family="sans-serif">Plan phase</text>
<text x="125" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#534AB7" font-family="sans-serif">phase-planning</text>
<text x="125" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7" font-family="sans-serif">Claude</text>
</g>
<line x1="190" y1="220" x2="214" y2="220" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="216" y="170" width="434" height="100" rx="12" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
<text x="228" y="184" font-size="10" fill="#57606a" font-family="sans-serif">↻ Epic loop</text>

<g class="node" data-detail="Cursor drafts an implementation plan for the next epic. Cursor, plan-next-epic.">
<rect x="232" y="186" width="130" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="297" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#04342C" font-family="sans-serif">Plan epic</text>
<text x="297" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#0F6E56" font-family="sans-serif">plan-next-epic</text>
<text x="297" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="sans-serif">Cursor</text>
</g>
<line x1="362" y1="220" x2="386" y2="220" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="node" data-detail="Claude checks the plan against repo truth and hard constraints before any code lands. Claude, plan-review.">
<rect x="388" y="186" width="130" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="453" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#26215C" font-family="sans-serif">Review plan</text>
<text x="453" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#534AB7" font-family="sans-serif">plan-review</text>
<text x="453" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7" font-family="sans-serif">Claude</text>
</g>
<line x1="518" y1="220" x2="542" y2="220" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="node" data-detail="Cursor implements the approved plan and runs code review.">
<rect x="544" y="186" width="90" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="589" y="210" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#04342C" font-family="sans-serif">Build</text>
<text x="589" y="230" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="sans-serif">Cursor</text>
</g>

<path d="M453 254 L453 264 L297 264 L297 256" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="375" y="263" text-anchor="middle" font-size="9" fill="#57606a" font-family="sans-serif">revise</text>

<line x1="650" y1="220" x2="674" y2="220" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="node" data-detail="Once every epic ships, the phase closes and the next planning pass starts from what's actually in the repo. Cursor, ship-phase.">
<rect x="676" y="186" width="130" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="741" y="204" text-anchor="middle" dominant-baseline="central" font-weight="600" font-size="13" fill="#04342C" font-family="sans-serif">Ship phase</text>
<text x="741" y="222" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#0F6E56" font-family="sans-serif">ship-phase</text>
<text x="741" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="sans-serif">Cursor</text>
</g>
</svg>
<p id="detail-out" style="margin: 12px 0 0; font-size: 13px; color: var(--text-secondary); min-height: 36px;">Hover a step to see what happens there.</p>
<script>
  document.querySelectorAll('.node').forEach(function(el) {
    el.style.cursor = 'default';
    el.addEventListener('mouseenter', function() {
      document.getElementById('detail-out').textContent = el.getAttribute('data-detail');
      el.style.opacity = '0.75';
    });
    el.addEventListener('mouseleave', function() {
      el.style.opacity = '1';
    });
  });
</script>
